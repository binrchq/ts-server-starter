# 本地一键起全套依赖。生产请用 deploy/ 下的编排示例。
#
# 注意端口映射到宿主机时做了区分：outer 4600 对外，其余默认只监听宿主 localhost，
# 与「多端口 = 部署级隔离」的设计一致。
services:
  app:
    build:
      context: .
      target: runtime
    image: ts-server-starter:local
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      APP__NAME: ts-server-starter
      SERVER__PORT: "4600"
      SERVER__ADMIN_PORT: "4601"
      SERVER__INTERNAL_PORT: "4602"
      SERVER__OPENAPI_PORT: "4603"
      SERVER__METRICS_PORT: "4604"
      DATABASE__DRIVER: postgres
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USERNAME: postgres
      DATABASE__PASSWORD: postgres
      DATABASE__NAME: ts_starter
      DATABASE__SCHEMA: public
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      CACHE__DRIVER: memory
      MQ__DRIVER: memory
      STATE__DRIVER: memory
      LOGGING__LEVEL: info
      LOGGING__FORMAT: json
      SECURITY__SESSION_SECRET: ${SESSION_SECRET:?请在 .env 里设置 SECURITY__SESSION_SECRET（至少 32 字符）}
      SECURITY__INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请设置 SECURITY__INTERNAL_TOKEN}
      SECURITY__ALLOWED_ORIGINS: http://localhost:3000
      DEV_AUTH_BYPASS: "1"
    ports:
      - "4600:4600"
      - "127.0.0.1:4601:4601"
      - "127.0.0.1:4602:4602"
      - "127.0.0.1:4603:4603"
      - "127.0.0.1:4604:4604"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ts_starter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ts_starter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
